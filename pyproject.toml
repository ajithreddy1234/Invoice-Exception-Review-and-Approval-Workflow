[project]
name = "asa-invoice-review"
version = "0.7.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.28,<1",
  "google-auth[requests]>=2.38,<3",
  "python-multipart>=0.0.20,<1",
  "pdfplumber>=0.11,<1",
  "pypdfium2>=5,<6",
  "Pillow>=12,<13",
  "google-genai>=1,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "reportlab==4.4.9", "pypdf==6.10.0"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

