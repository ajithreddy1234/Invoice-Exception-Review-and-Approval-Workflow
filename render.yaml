services:
  - type: web
    name: asa-invoice-review
    runtime: docker
    plan: free
    numInstances: 1
    healthCheckPath: /health/live
    envVars:
      - key: APP_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: AUTO_IMPORT_ON_STARTUP
        value: "true"
      - key: REFERENCE_TTL_HOURS
        value: "24"
      - key: WORKER_ENABLED
        value: "true"
      - key: STORAGE_BUCKET
        value: invoice-originals
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GOOGLE_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/Sheet_Service.json
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
